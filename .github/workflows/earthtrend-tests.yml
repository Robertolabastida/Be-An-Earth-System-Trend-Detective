name: EarthTrend AI checks
on:
  push:
    branches: [feature/appeears-data-source-selector]
  pull_request:
    paths:
      - 'Página web 2/**'
      - '.github/workflows/earthtrend-tests.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r "Página web 2/requirements.txt"
      - run: python -m pytest "Página web 2/tests" -q
      - run: node --check "Página web 2/static/app.js"
