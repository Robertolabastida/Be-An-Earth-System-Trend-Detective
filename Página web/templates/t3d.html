<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Globo terráqueo</title>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #globo { position: fixed; inset: 0; }
    .cesium-viewer-bottom { opacity: .5; }
  </style>
</head>
<body>
  <div id="globo"></div>

  <script>

    const viewer = new Cesium.Viewer("globo", {
      baseLayer: false, baseLayerPicker: false, geocoder: false, homeButton: false,
      sceneModePicker: false, navigationHelpButton: false, animation: false,
      timeline: false, fullscreenButton: false, infoBox: false, selectionIndicator: false
    });

    function gibs(layer, matrix, ext) {
      return new Cesium.WebMapTileServiceImageryProvider({
        url: `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${layer}/default/${matrix}/{TileMatrix}/{TileRow}/{TileCol}.${ext}`,
        layer, style: "default", format: ext === "png" ? "image/png" : "image/jpeg",
        tileMatrixSetID: matrix, maximumLevel: parseInt(matrix.slice(-1)),
        tilingScheme: new Cesium.WebMercatorTilingScheme(),
        tileWidth: 256, tileHeight: 256, credit: "NASA GIBS"
      });
    }

    
    const dia = viewer.imageryLayers.addImageryProvider(
      gibs("BlueMarble_ShadedRelief_Bathymetry", "GoogleMapsCompatible_Level8", "jpeg"));
    dia.nightAlpha = 0;
    const noche = viewer.imageryLayers.addImageryProvider(
      gibs("VIIRS_Black_Marble", "GoogleMapsCompatible_Level8", "png"));
    noche.dayAlpha = 0;

    
    const scene = viewer.scene, globe = scene.globe;
    globe.enableLighting = true;
    globe.dynamicAtmosphereLighting = true;
    globe.showGroundAtmosphere = true;
    globe.baseColor = Cesium.Color.fromCssColorString("#02050c");
    globe.maximumScreenSpaceError = 1.2;
    scene.skyAtmosphere.show = true;
    scene.highDynamicRange = true;
    scene.backgroundColor = Cesium.Color.BLACK;
    viewer.resolutionScale = window.devicePixelRatio || 1;
    viewer.clock.currentTime = Cesium.JulianDate.now();

   
    const ctrl = scene.screenSpaceCameraController;
    ctrl.minimumZoomDistance = 500;
    ctrl.maximumZoomDistance = 1500000000; // ~1.5 millones de km: se ve la Luna en su órbita
    scene.moon.show = true;
    scene.sun.show = true;
    ctrl.inertiaZoom = 0.85;

    viewer.camera.setView({ destination: Cesium.Cartesian3.fromDegrees(-100, 20, 22000000) });

    
    let girando = true;
    ["pointerdown", "wheel", "touchstart"].forEach((e) =>
      viewer.canvas.addEventListener(e, () => (girando = false), { passive: true }));
    scene.preRender.addEventListener(() => {
      if (girando) viewer.camera.rotate(Cesium.Cartesian3.UNIT_Z, -0.0006);
    });
  </script>
</body>
</html>
